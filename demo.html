<script src="js/app.js?v=9"></script>
<script>
  window.NEXTUP_DEMO_MODE = true;
  (async () => {
    const res = await NextUpAuth.continueAsGuest();
    if (!res || res.ok === false) {
      document.getElementById('mainTitle').textContent = 'Demo unavailable';
      document.getElementById('mainSub').textContent = 'Could not start the demo session — please try again in a moment.';
      return;
    }
    const user = await NextUpAuth.currentUser();
    if (user) NextUpApp.init(user);
  })();
</script>
