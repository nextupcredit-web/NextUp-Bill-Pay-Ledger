<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In · NextUp Bill Pay Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand"><span class="brand-mark">N</span></div>
    <h1>Welcome back</h1>
    <p class="sub">Log in to your NextUp Bill Pay Ledger</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <div class="form-error" id="formError"></div>
      <div class="auth-actions">
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </div>
    </form>

    <div class="auth-divider">or</div>
    <button class="btn btn-secondary btn-block" id="guestBtn">Continue with a demo account</button>

    <div class="auth-alt">Don't have an account? <a href="signup.html" style="color:var(--chase-blue);font-weight:700;">Sign up</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/store.js"></script>
<script src="js/seed.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('formError');
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    const res = await NextUpAuth.logIn(email, password);
    if (!res.ok) { btn.disabled = false; errEl.textContent = res.error; errEl.classList.add('show'); return; }
    const user = await NextUpAuth.currentUser();
    window.location.href = user.subscribed ? 'dashboard.html' : 'checkout.html';
  });

  document.getElementById('guestBtn').addEventListener('click', async (e) => {
    e.target.disabled = true;
    const res = await NextUpAuth.continueAsGuest();
    if (!res.ok) { e.target.disabled = false; alert(res.error); return; }
    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
