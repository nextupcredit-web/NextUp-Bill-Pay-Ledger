<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In · NextUp Bill Pay Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#085eb0">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand"><span class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6.5 17V7" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M17.5 17V7" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M6.5 14.5L17.5 7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle class="tick" cx="17.5" cy="7" r="2.3" fill="#34e0a1"/>
      </svg>
    </span></div>
    <h1>Welcome back</h1>
    <p class="sub">Log in to your NextUp Bill Pay Ledger</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <div class="form-error" id="formError"></div>
      <div class="auth-actions">
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </div>
    </form>

    <div class="auth-alt">Don't have an account? <a href="signup.html" style="color:var(--chase-blue);font-weight:700;">Sign up</a></div>
  </div>
  <div class="auth-legal-links"><a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/store.js"></script>
<script src="js/seed.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('formError');
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    const res = await NextUpAuth.logIn(email, password);
    if (!res.ok) { btn.disabled = false; errEl.textContent = res.error; errEl.classList.add('show'); return; }
    const user = await NextUpAuth.currentUser();
    window.location.href = user.subscribed ? 'dashboard.html' : 'checkout.html';
  });
</script>
</body>
</html>
