<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · NextUp Bill Pay Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="mobile-topbar">
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="brand"><span class="brand-mark">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6.5 17V7" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M17.5 17V7" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M6.5 14.5L17.5 7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="tick" cx="17.5" cy="7" r="2.3" fill="#34e0a1"/>
    </svg>
  </span> NextUp</div>
  <div class="mobile-topbar-actions">
    <div class="side-avatar avatar-display">?</div>
    <button class="logout-trigger" aria-label="Log out"><span>&#8618;</span></button>
  </div>
</header>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6.5 17V7" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M17.5 17V7" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M6.5 14.5L17.5 7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="tick" cx="17.5" cy="7" r="2.3" fill="#34e0a1"/>
    </svg>
  </span> NextUp</div>
    <nav class="side-nav">
      <a href="#" class="side-link active" data-tab="overview"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg></span> Overview</a>
      <a href="#" class="side-link" data-tab="income"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M15 9.8c0-1.3-1.3-2.3-3-2.3s-3 .9-3 2.1c0 3.1 6 1.4 6 4.5 0 1.3-1.3 2.2-3 2.2s-3-1-3-2.3"/></svg></span> Income</a>
      <a href="#" class="side-link" data-tab="bills"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-2.5-1.6L13 21l-2.5-1.6L8 21l-2-1.6z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span> Bills</a>
      <a href="#" class="side-link" data-tab="debts"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l7 7 4-4 7 7"/><path d="M15 16h6v-6"/></svg></span> Debt Snowball</a>
      <a href="#" class="side-link" data-tab="business"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="12" rx="2"/><path d="M8 7.5V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1.5M3 12.5h18"/></svg></span> Business</a>
      <a href="#" class="side-link" data-tab="calendar"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg></span> Calendar</a>
      <a href="#" class="side-link" data-tab="all"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg></span> All Items</a>
    </nav>
    <div class="side-footer">
      <div class="side-user">
        <div class="side-avatar avatar-display">?</div>
        <div>
          <div class="user-name-display" style="font-weight:700;color:#fff;">—</div>
          <div class="user-plan-display" style="font-size:11.5px;color:rgba(255,255,255,0.6);">—</div>
        </div>
      </div>
      <a href="#" class="side-link" id="billingTrigger"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2.2"/><path d="M2.5 9.8h19"/></svg></span> Manage billing</a>
      <a href="#" class="side-link logout-trigger"><span class="ic">&#8618;</span> Log out</a>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <div>
        <h1 id="mainTitle">Overview</h1>
        <div class="sub" id="mainSub">Your whole financial picture, updated in real time.</div>
      </div>
    </div>

    <div class="tabpage active" id="tab-overview"></div>
    <div class="tabpage" id="tab-income"></div>
    <div class="tabpage" id="tab-bills"></div>
    <div class="tabpage" id="tab-debts"></div>
    <div class="tabpage" id="tab-business"></div>
    <div class="tabpage" id="tab-calendar"><div id="calRoot"></div></div>
    <div class="tabpage" id="tab-all"></div>
  </main>
</div>

<div class="modal-overlay" id="dayModalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="dayModalTitle">Day</h3>
      <button class="modal-close" id="dayModalClose">&times;</button>
    </div>
    <div id="dayModalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/store.js"></script>
<script src="js/seed.js"></script>
<script src="js/auth.js"></script>
<script src="js/calendar.js"></script>
<script src="js/app.js"></script>
<script>
  (async () => {
    const user = await NextUpAuth.requireSubscription('checkout.html');
    if (user) NextUpApp.init(user);
  })();
</script>
</body>
</html>
